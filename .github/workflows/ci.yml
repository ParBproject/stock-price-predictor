name: Forecast research quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest numpy pandas scikit-learn statsmodels yfinance requests vaderSentiment matplotlib seaborn pandas-market-calendars

      - name: Lint critical errors
        run: ruff check src data tests --select E4,E7,E9,F

      - name: Compile Python sources
        run: python -m compileall -q src data tests

      - name: Run regression suite
        run: python -m pytest -q

      - name: Verify research modules
        run: python -c "import src.backtesting, src.data_loader, src.evaluator, src.research_evaluation"
