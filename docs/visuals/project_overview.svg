<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Stock Price Predictor project overview</title>
  <desc id="desc">A dark dashboard-style visual showing data ingestion, feature engineering, LSTM and Random Forest models, evaluation, and backtesting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1220" cy="70" r="180" fill="#1d4ed8" opacity="0.10"/>
  <circle cx="180" cy="560" r="180" fill="#06b6d4" opacity="0.08"/>
  <text x="70" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Stock Price Predictor</text>
  <text x="70" y="122" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#94a3b8">Leakage-aware forecasting • LSTM + Random Forest • Backtrader validation</text>
  <rect x="70" y="160" width="1260" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="230" height="150" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="325" y="205" width="230" height="150" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="580" y="205" width="240" height="150" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="845" y="205" width="230" height="150" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="1100" y="205" width="230" height="150" rx="20" fill="#111827" stroke="#334155"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="95" y="245" font-size="16" font-weight="700" fill="#60a5fa">01 • DATA</text>
    <text x="95" y="280" font-size="24" font-weight="700" fill="#f8fafc">Market Inputs</text>
    <text x="95" y="312" font-size="15" fill="#94a3b8">yfinance OHLCV</text>
    <text x="95" y="336" font-size="15" fill="#94a3b8">optional news sentiment</text>

    <text x="350" y="245" font-size="16" font-weight="700" fill="#34d399">02 • FEATURES</text>
    <text x="350" y="280" font-size="24" font-weight="700" fill="#f8fafc">Signal Engineering</text>
    <text x="350" y="312" font-size="15" fill="#94a3b8">RSI • MACD • ATR</text>
    <text x="350" y="336" font-size="15" fill="#94a3b8">returns • lags • volatility</text>

    <text x="605" y="245" font-size="16" font-weight="700" fill="#f59e0b">03 • MODELS</text>
    <text x="605" y="280" font-size="24" font-weight="700" fill="#f8fafc">LSTM + Random Forest</text>
    <text x="605" y="312" font-size="15" fill="#94a3b8">sequence learning</text>
    <text x="605" y="336" font-size="15" fill="#94a3b8">tree-based forecasting</text>

    <text x="870" y="245" font-size="16" font-weight="700" fill="#a78bfa">04 • VALIDATION</text>
    <text x="870" y="280" font-size="24" font-weight="700" fill="#f8fafc">Time-Aware Tests</text>
    <text x="870" y="312" font-size="15" fill="#94a3b8">train-only scaling</text>
    <text x="870" y="336" font-size="15" fill="#94a3b8">next-day target alignment</text>

    <text x="1125" y="245" font-size="16" font-weight="700" fill="#fb7185">05 • BACKTEST</text>
    <text x="1125" y="280" font-size="24" font-weight="700" fill="#f8fafc">Strategy Review</text>
    <text x="1125" y="312" font-size="15" fill="#94a3b8">commission-aware sizing</text>
    <text x="1125" y="336" font-size="15" fill="#94a3b8">equity + drawdown analysis</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
    <path d="M300 280 H315"/>
    <path d="M555 280 H570"/>
    <path d="M820 280 H835"/>
    <path d="M1075 280 H1090"/>
  </g>

  <rect x="70" y="405" width="1260" height="145" rx="22" fill="#0f172a" stroke="#1e293b"/>
  <text x="95" y="444" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">ENGINEERING FOCUS</text>
  <text x="95" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">The repository is built to make evaluation mistakes visible — not hide them.</text>
  <text x="95" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#94a3b8">Regression-tested safeguards cover target leakage, sentiment look-ahead, holdout sequence context, next-day signal alignment, commission-aware sizing, and equity-curve alignment.</text>
</svg>