<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning pipeline</title>
  <desc id="desc">Diagram of data preparation, chronological split, LSTM and Random Forest paths, evaluation, and backtesting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f8fafc">End-to-End ML Workflow</text>
  <text x="70" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#94a3b8">Chronological data flow with explicit forecast timing and leakage controls</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="165" width="230" height="100" rx="18" fill="#0f172a" stroke="#3b82f6"/>
    <text x="95" y="202" font-size="15" font-weight="700" fill="#60a5fa">INGEST</text>
    <text x="95" y="235" font-size="22" font-weight="700" fill="#f8fafc">OHLCV + Sentiment</text>

    <rect x="365" y="165" width="240" height="100" rx="18" fill="#0f172a" stroke="#10b981"/>
    <text x="390" y="202" font-size="15" font-weight="700" fill="#34d399">FEATURES</text>
    <text x="390" y="235" font-size="22" font-weight="700" fill="#f8fafc">Technical Indicators</text>

    <rect x="670" y="165" width="240" height="100" rx="18" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="695" y="202" font-size="15" font-weight="700" fill="#a78bfa">SPLIT</text>
    <text x="695" y="235" font-size="22" font-weight="700" fill="#f8fafc">Chronological Holdout</text>

    <rect x="975" y="165" width="350" height="100" rx="18" fill="#0f172a" stroke="#f59e0b"/>
    <text x="1000" y="202" font-size="15" font-weight="700" fill="#fbbf24">TARGET SEMANTICS</text>
    <text x="1000" y="235" font-size="22" font-weight="700" fill="#f8fafc">Features[t] → Close[t+1]</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M300 215 H350"/>
    <path d="M605 215 H655"/>
    <path d="M910 215 H960"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="145" y="350" width="490" height="220" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="175" y="392" font-size="16" font-weight="700" fill="#f59e0b">RANDOM FOREST PATH</text>
    <text x="175" y="430" font-size="25" font-weight="700" fill="#f8fafc">Tabular next-day forecasting</text>
    <text x="175" y="468" font-size="16" fill="#94a3b8">• shifted future target before train/test split</text>
    <text x="175" y="497" font-size="16" fill="#94a3b8">• regression + directional classification</text>
    <text x="175" y="526" font-size="16" fill="#94a3b8">• feature importance + backtest integration</text>

    <rect x="765" y="350" width="490" height="220" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="795" y="392" font-size="16" font-weight="700" fill="#22d3ee">LSTM PATH</text>
    <text x="795" y="430" font-size="25" font-weight="700" fill="#f8fafc">Sequence-based forecasting</text>
    <text x="795" y="468" font-size="16" fill="#94a3b8">• scaler fit on training data only</text>
    <text x="795" y="497" font-size="16" fill="#94a3b8">• trailing train context preserved for holdout</text>
    <text x="795" y="526" font-size="16" fill="#94a3b8">• every test date receives a prediction</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1150 265 V315 H390 V335"/>
    <path d="M1150 265 V315 H1010 V335"/>
  </g>

  <rect x="225" y="625" width="950" height="82" rx="20" fill="#111827" stroke="#475569"/>
  <text x="255" y="657" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fb7185">EVALUATE → BACKTEST</text>
  <text x="255" y="687" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#e2e8f0">RMSE / MAE / classification metrics → next-day signals → commission-aware execution → equity / drawdown review</text>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M390 570 V610 H570"/>
    <path d="M1010 570 V610 H830"/>
  </g>
</svg>