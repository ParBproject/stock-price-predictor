<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Correctness safeguards</title>
  <desc id="desc">Dashboard cards showing target leakage prevention, sentiment look-ahead prevention, holdout context preservation, backtest alignment, commission-aware sizing, and equity-curve alignment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.24"/></filter>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f8fafc">Correctness Safeguards</text>
  <text x="70" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#94a3b8">Regression-tested protections around time-series leakage, forecast alignment, and backtest execution</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="165" width="390" height="180" rx="22" fill="#0f172a" stroke="#3b82f6"/>
    <text x="98" y="205" font-size="15" font-weight="700" fill="#60a5fa">TARGET ALIGNMENT</text>
    <text x="98" y="243" font-size="23" font-weight="700" fill="#f8fafc">No same-day target leakage</text>
    <text x="98" y="279" font-size="16" fill="#94a3b8">Features at t predict Close[t+1].</text>
    <text x="98" y="308" font-size="16" fill="#94a3b8">The final row is dropped when its future target is unknown.</text>

    <rect x="505" y="165" width="390" height="180" rx="22" fill="#0f172a" stroke="#10b981"/>
    <text x="533" y="205" font-size="15" font-weight="700" fill="#34d399">SENTIMENT TIMING</text>
    <text x="533" y="243" font-size="23" font-weight="700" fill="#f8fafc">No future-news backfill</text>
    <text x="533" y="279" font-size="16" fill="#94a3b8">Sentiment only propagates forward.</text>
    <text x="533" y="308" font-size="16" fill="#94a3b8">Pre-news dates remain neutral rather than seeing future data.</text>

    <rect x="940" y="165" width="390" height="180" rx="22" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="968" y="205" font-size="15" font-weight="700" fill="#a78bfa">LSTM HOLDOUT</text>
    <text x="968" y="243" font-size="23" font-weight="700" fill="#f8fafc">Training history preserved</text>
    <text x="968" y="279" font-size="16" fill="#94a3b8">First test window uses trailing train context.</text>
    <text x="968" y="308" font-size="16" fill="#94a3b8">No initial 60-day holdout block is discarded.</text>

    <rect x="70" y="390" width="390" height="180" rx="22" fill="#0f172a" stroke="#f59e0b"/>
    <text x="98" y="430" font-size="15" font-weight="700" fill="#fbbf24">BACKTEST SIGNALS</text>
    <text x="98" y="468" font-size="23" font-weight="700" fill="#f8fafc">Forecast vs current close</text>
    <text x="98" y="504" font-size="16" fill="#94a3b8">Next-day predictions are compared with known Close[t].</text>
    <text x="98" y="533" font-size="16" fill="#94a3b8">No stale previous-day comparison.</text>

    <rect x="505" y="390" width="390" height="180" rx="22" fill="#0f172a" stroke="#fb7185"/>
    <text x="533" y="430" font-size="15" font-weight="700" fill="#fb7185">EXECUTION</text>
    <text x="533" y="468" font-size="23" font-weight="700" fill="#f8fafc">Commission-aware sizing</text>
    <text x="533" y="504" font-size="16" fill="#94a3b8">Share count uses spendable cash and fees.</text>
    <text x="533" y="533" font-size="16" fill="#94a3b8">Prevents deterministic margin rejection from oversizing.</text>

    <rect x="940" y="390" width="390" height="180" rx="22" fill="#0f172a" stroke="#22d3ee"/>
    <text x="968" y="430" font-size="15" font-weight="700" fill="#22d3ee">EQUITY CURVE</text>
    <text x="968" y="468" font-size="23" font-weight="700" fill="#f8fafc">One value per bar</text>
    <text x="968" y="504" font-size="16" fill="#94a3b8">Portfolio observations and dates must align exactly.</text>
    <text x="968" y="533" font-size="16" fill="#94a3b8">Length mismatches fail explicitly in tests.</text>
  </g>

  <rect x="70" y="620" width="1260" height="45" rx="16" fill="#111827" stroke="#1e293b"/>
  <text x="700" y="649" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">Design principle: evaluation code is part of the model — and gets tested like production logic.</text>
</svg>